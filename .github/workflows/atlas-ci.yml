name: Atlas — validação
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            package-lock.json
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm test
      - run: npm run build
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            web/tools/requirements-network.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests web/tests
